# Data contract (ODCS). Approved by John (Oct 28, 2026). 0.3.0 proposed (Nov 11, 2026) for C13 part 2, waiting for John's approval: every carrier, carrier names from the provider ID. ODCS version is a working placeholder (design-doc OQ-32).
# FCC file layout beyond what the Documentation Plan confirms is open (OQ-20, OQ-7).
apiVersion: v3.0.2
kind: DataContract
id: p1-source-fcc-mobile-coverage
name: fcc_mobile_coverage
version: 0.3.0
status: active
domain: project1-signal-planner
dataProduct: signal-planner
description:
  purpose: Mobile coverage published by the FCC (U.S. Federal Communications Commission), downloaded per provider, state and technology as a Shapefile or GeoPackage; most datasets include H3 resolution 9 hexagons alongside the raw modeled coverage. Used to flag each trail point covered or not for a carrier.
  limitations: Coverage is a modeled claim, not a measurement; the confidence model (Phase B) judges how far to trust it. Every carrier in the park's FCC files is loaded for Arizona (ADR 0031), which is AT&T, T-Mobile and Verizon, 4G LTE and 5G-NR 7/1 Mbps. The 5G-NR 35/3 Mbps files are not loaded, because their cells are also in the 7/1 files. The newest file of each provider and technology replaces the older one. The release cadence and terms are not recorded (OQ-20, OQ-22).
  usage: Input to C6 (coverage flag) and C13 (all carriers); source of SCD Type 2 carrier coverage history in Snowflake (Phase B).
team:
  - username: John
    role: owner
servers:
  - server: fcc-coverage-download
    type: api
    description: FCC coverage file download per provider, state and technology. Exact location to be fixed in the first-run check (OQ-20).
    location: "Public FCC download, by hand because the site refuses automated requests. Raw copies: s3://portfolio-{env}-raw-{account}/signal/fcc/coverage/. Lake table: portfolio.portfolio_{env}.fcc_coverage_cell."
slaProperties:
  - property: frequency
    value: release cadence not recorded
    description: Freshness target depends on the FCC release schedule (OQ-20). Reference data refresh cadence is OQ-25.
  - property: retention
    value: raw files kept
customProperties:
  - property: openQuestions
    value: OQ-7, OQ-11, OQ-20, OQ-22, OQ-25
  - property: adr
    value: adrs/0007, adrs/0015
schema:
  - name: fcc_coverage_cell
    physicalName: fcc_coverage_cell
    physicalType: table
    description: One row per H3 resolution 9 cell, carrier, technology and release. Partition per pull.
    properties:
      - name: h3_cell_res9
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: H3 resolution 9 cell index from the file's hexagons.
      - name: carrier
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: Carrier name from the file's provider ID (130077 AT&T, 130403 T-Mobile, 131425 Verizon), the same names the report API accepts; the brand text in the file is not used.
      - name: technology
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 3
        description: Technology as named in the FCC file.
      - name: release
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 4
        description: FCC release identifier or date; basis for SCD Type 2 rows in Phase B. Format open (OQ-20).
      - name: environment
        logicalType: integer
        required: true
        description: The file's `environmnt` value, 0 for outdoor and standing still, 1 for in a moving vehicle. Kept, not filtered on (OQ-44).
      - name: min_signal_dbm
        logicalType: integer
        required: true
        description: The file's `minsignal` value in dBm. Kept, not filtered on (OQ-44).
      - name: source_url
        logicalType: string
        required: true
      - name: fetched_at_utc
        logicalType: timestamp
        required: true
      - name: content_sha256
        logicalType: string
        required: true
    # Every listed cell counts as covered, whatever its environment or signal (John, Nov 4, 2026, OQ-44).
    quality:
      - type: library
        metric: nullValues
        mustBe: 0
      - type: library
        metric: duplicateValues
        mustBe: 0
        arguments:
          properties:
            - h3_cell_res9
            - carrier
            - technology
            - release
