# Data contract (ODCS). Approved by John (Oct 28, 2026). ODCS version is a working placeholder (design-doc OQ-32).
# Upstream field names and types were confirmed against a real file on Oct 28, 2026 (OQ-6, OQ-20).
# The snake_case names below are the lake column names. Each column read from the source names its
# upstream field in upstreamField and the JSON type in upstreamType; the loader owns the rename, and
# the contract diff (C8) checks the upstream fields before loading.
apiVersion: v3.0.2
kind: DataContract
id: p1-source-celestrak-gp
name: celestrak_gp
version: 0.2.0
status: active
domain: project1-signal-planner
dataProduct: signal-planner
description:
  purpose: Orbital elements (GP data, meaning general perturbations elements, as JSON) for the Starlink satellites listed by CelesTrak, used to select Direct-to-Cell satellites by the [DTC] name tag and to propagate them with SGP4.
  limitations: Pulled no more than once per 2-hour update. Any non-200 response stops the pull. Raw files are immutable. The terms and credit text of CelesTrak are not recorded (OQ-22).
  usage: Input to the DTC selector (C2) and the satellite window engine (C5).
team:
  - username: John
    role: owner
servers:
  - server: celestrak-gp-json
    type: api
    description: CelesTrak Starlink list, GP data as JSON (confirmed by the first-run check, OQ-20).
    location: "https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=json. Raw copies: s3://portfolio-{env}-raw-{account}/signal/celestrak/gp/fetched_at={time}/ (the file and a manifest). Lake table: {env}_signal.celestrak_gp (Glue catalog)."
slaProperties:
  - property: frequency
    value: 1
    unit: d
    description: One pull per nightly run at most; never more often than once per 2-hour update.
  - property: retention
    value: raw files kept
    description: Raw source files are kept (Decisions, storage clean-up). Live raw files are locked 30 days.
customProperties:
  - property: openQuestions
    value: OQ-6, OQ-20, OQ-22
  - property: adr
    value: adrs/0002, adrs/0018
schema:
  - name: celestrak_gp
    physicalName: celestrak_gp
    physicalType: table
    description: One row per satellite element set per pull. Partition per pull (run logical date). Carries source URL, fetch time and content hash from the raw manifest.
    properties:
      - name: norad_cat_id
        logicalType: integer
        required: true
        customProperties:
          - property: upstreamField
            value: NORAD_CAT_ID
          - property: upstreamType
            value: integer
        primaryKey: true
        primaryKeyPosition: 1
        description: Satellite catalog number.
      - name: epoch_utc
        logicalType: timestamp
        required: true
        customProperties:
          - property: upstreamField
            value: EPOCH
          - property: upstreamType
            value: string
        primaryKey: true
        primaryKeyPosition: 2
        description: Epoch of the element set, UTC.
      - name: object_name
        logicalType: string
        required: true
        customProperties:
          - property: upstreamField
            value: OBJECT_NAME
          - property: upstreamType
            value: string
        description: Satellite name; the [DTC] tag appears in this value for Direct-to-Cell satellites.
      - name: inclination_deg
        logicalType: number
        required: true
        customProperties:
          - property: upstreamField
            value: INCLINATION
          - property: upstreamType
            value: number
        description: Orbit inclination in degrees. Direct-to-Cell cross-check expects 43 or 53.
      - name: mean_motion_rev_per_day
        logicalType: number
        required: true
        customProperties:
          - property: upstreamField
            value: MEAN_MOTION
          - property: upstreamType
            value: number
        description: Mean motion; with eccentricity gives altitude for the cross-check (about 330 to 370 km).
      - name: eccentricity
        logicalType: number
        required: true
        customProperties:
          - property: upstreamField
            value: ECCENTRICITY
          - property: upstreamType
            value: number
      - name: ra_of_asc_node_deg
        logicalType: number
        required: true
        customProperties:
          - property: upstreamField
            value: RA_OF_ASC_NODE
          - property: upstreamType
            value: number
      - name: arg_of_pericenter_deg
        logicalType: number
        required: true
        customProperties:
          - property: upstreamField
            value: ARG_OF_PERICENTER
          - property: upstreamType
            value: number
      - name: mean_anomaly_deg
        logicalType: number
        required: true
        customProperties:
          - property: upstreamField
            value: MEAN_ANOMALY
          - property: upstreamType
            value: number
      - name: bstar
        logicalType: number
        required: true
        customProperties:
          - property: upstreamField
            value: BSTAR
          - property: upstreamType
            value: number
        description: Drag term used by SGP4.
      - name: source_url
        logicalType: string
        required: true
        description: URL the raw file came from.
      - name: fetched_at_utc
        logicalType: timestamp
        required: true
        description: Fetch time, UTC.
      - name: content_sha256
        logicalType: string
        required: true
        description: Hash of the raw file. Hash algorithm is a proposal (OQ-21).
    quality:
      - type: library
        metric: nullValues
        mustBe: 0
        description: Required fields are never null.
      - type: library
        metric: duplicateValues
        mustBe: 0
        arguments:
          properties:
            - norad_cat_id
            - epoch_utc
            - fetched_at_utc
        description: Unique per satellite, epoch and pull.
