# Data contract (ODCS). Approved by John (Oct 29, 2026). Internal Iceberg table, written by Spark (C2). Not a source or a published table;
# included because C5 reads it, and the loader takes its column types from here.
apiVersion: v3.0.2
kind: DataContract
id: p1-internal-dtc-satellite
name: dtc_satellite
version: 0.1.0
status: active
domain: project1-signal-planner
dataProduct: signal-planner
description:
  purpose: The Starlink satellites that can carry a satellite text (the [DTC] tag in their CelesTrak name), with the orbital elements the window engine propagates and the altitude the cross-check computed.
  limitations: Selected by the name tag only (ADR 0002). A satellite whose altitude or inclination disagrees with the Direct-to-Cell shells stays selected and is listed in dtc_disagreement. Elements come from one CelesTrak pull per run.
  usage: Input to the satellite window engine (C5).
team:
  - username: John
    role: owner
servers:
  - server: iceberg-dtc-satellite
    type: s3
    description: Iceberg table in the lake, written by Spark through the Glue catalog. Separate for dev and live.
    location: "Lake table portfolio.portfolio_{env}.dtc_satellite in s3://portfolio-{env}-lake-{account}/."
slaProperties:
  - property: frequency
    value: 1
    unit: d
    description: Rewritten in each nightly run (10:00 UTC). Partition overwrite by run date makes a rerun safe.
customProperties:
  - property: openQuestions
    value: OQ-6, OQ-21
  - property: adr
    value: adrs/0002
schema:
  - name: dtc_satellite
    physicalName: dtc_satellite
    physicalType: table
    description: One row per selected satellite per run. Partition per run date.
    properties:
      - name: norad_cat_id
        logicalType: integer
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: NORAD catalog number, from celestrak_gp.
      - name: object_name
        logicalType: string
        required: true
        description: CelesTrak name, which carries the [DTC] tag.
      - name: epoch_utc
        logicalType: timestamp
        required: true
        description: Epoch of the element set, UTC.
      - name: inclination_deg
        logicalType: number
        required: true
      - name: mean_motion_rev_per_day
        logicalType: number
        required: true
      - name: eccentricity
        logicalType: number
        required: true
      - name: ra_of_asc_node_deg
        logicalType: number
        required: true
      - name: arg_of_pericenter_deg
        logicalType: number
        required: true
      - name: mean_anomaly_deg
        logicalType: number
        required: true
      - name: bstar
        logicalType: number
        required: true
      - name: perigee_km
        logicalType: number
        required: true
        description: Lowest altitude above the equatorial radius, from mean motion and eccentricity.
      - name: apogee_km
        logicalType: number
        required: true
        description: Highest altitude above the equatorial radius, from mean motion and eccentricity.
      - name: fetched_at_utc
        logicalType: timestamp
        required: true
        description: When the CelesTrak file these elements came from was pulled.
      - name: content_sha256
        logicalType: string
        required: true
        description: Hash of that raw file, so a row can be traced to the file it came from.
    quality:
      - type: library
        metric: nullValues
        mustBe: 0
        description: Applies to required fields.
      - type: library
        metric: duplicateValues
        mustBe: 0
        arguments:
          properties:
            - norad_cat_id
      - type: library
        metric: rowCount
        mustBeGreaterThan: 0
        description: A run with no tagged satellite stops before it is written.
