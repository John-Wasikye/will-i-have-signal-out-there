# Data contract (ODCS). 0.1.0 approved by John (Oct 28, 2026), Phase B. 0.2.0 proposed (Nov 10, 2026), waiting for John's approval: source and fields from the OQ-10 first-run check. ODCS version is a working placeholder (design-doc OQ-32).
apiVersion: v3.0.2
kind: DataContract
id: p1-source-ookla-open-data
name: ookla_open_data
version: 0.2.0
status: proposed
domain: project1-signal-planner
dataProduct: signal-planner
description:
  purpose: Ookla open mobile speed-test data for Arizona (quarterly, zoom 16 tiles about 610 m across at the equator and about 490 m at Grand Canyon), used as measured evidence for the coverage confidence model. Ookla filters the tests to GPS-quality locations before publishing, so the loader has no accuracy filter.
  limitations: License CC BY-NC-SA 4.0 (non-commercial, credit, share-alike). Derived data published here carries the same license. Speed tests exist only where phones had signal, so dead zones are missing. A tile mixes the tests of every carrier. The file has no carrier field, so a tile is evidence that some phone had data there, not that a given carrier works. Data is thin on the trails (in 2026 quarter 3, 22 tiles and 96 tests near the three Grand Canyon trails). It is a public archive, so a manifest of URL, size and hash is stored instead of a full copy (engineering standard 1, which keeps a manifest for public archives).
  usage: Input to C13 and C17.
team:
  - username: John
    role: owner
servers:
  - server: ookla-open-data-aws
    type: s3
    description: Ookla's public bucket on AWS (us-west-2), read without signing in. One worldwide Parquet file per quarter (2026 quarter 3, published Oct 9, 2026, 189,644,612 bytes, 3,477,926 tiles), so the loader keeps only Arizona tiles by tile centre (OQ-10).
    location: "s3://ookla-open-data/parquet/performance/type=mobile/year={year}/quarter={q}/{yyyy-mm-dd}_performance_mobile_tiles.parquet, the date being the quarter's first day. Manifest: s3://portfolio-{env}-raw-{account}/signal/ookla/manifest/ (proposed). Lake table: portfolio.portfolio_{env}.ookla_tile (proposed)."
slaProperties:
  - property: frequency
    value: 1
    unit: quarter
    description: Quarterly release.
  - property: retention
    value: manifest kept
customProperties:
  - property: license
    value: "Includes data derived from Speedtest by Ookla® open data, licensed under CC BY-NC-SA 4.0. Derived data published here is shared under the same license."
  - property: openQuestions
    value: OQ-2, OQ-14
  - property: adr
    value: adrs/0007, adrs/0013
schema:
  - name: ookla_tile
    physicalName: ookla_tile
    physicalType: table
    description: One row per tile and quarter, with the H3 resolution 8 cell assigned at load (engineering standard 9, which picks the H3 resolution from the source). The source fields (OQ-10) are quadkey, tile (outline as WKT text), tile_x and tile_y (centre), avg_d_kbps, avg_u_kbps, avg_lat_ms, avg_lat_down_ms, avg_lat_up_ms, tests, devices.
    properties:
      - name: quarter
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: Quarter of the release.
      - name: tile_key
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 2
        description: The source's quadkey, a 16-character zoom 16 tile code.
      - name: h3_cell_res8
        logicalType: string
        required: true
        description: H3 resolution 8 cell of the tile centre (tile_x, tile_y) (ADR 0007).
      - name: test_count
        logicalType: integer
        required: true
        description: The source's tests, the number of tests in the tile; basis for "enough tests nearby" (threshold OQ-14).
      - name: device_count
        logicalType: integer
        required: true
        description: The source's devices, the number of distinct phones that ran the tests.
      - name: avg_download_kbps
        logicalType: integer
        required: true
        description: The source's avg_d_kbps, average download speed in kilobits per second.
      - name: avg_upload_kbps
        logicalType: integer
        required: true
        description: The source's avg_u_kbps, average upload speed in kilobits per second.
      - name: avg_latency_ms
        logicalType: integer
        required: true
        description: The source's avg_lat_ms, average latency in milliseconds.
      - name: source_url
        logicalType: string
        required: true
      - name: fetched_at_utc
        logicalType: timestamp
        required: true
      - name: content_sha256
        logicalType: string
        required: true
    quality:
      - type: library
        metric: nullValues
        mustBe: 0
      - type: library
        metric: duplicateValues
        mustBe: 0
        arguments:
          properties:
            - quarter
            - tile_key
