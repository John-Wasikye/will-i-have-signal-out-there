# Data contract (ODCS). Approved by John (Oct 28, 2026). ODCS version is a working placeholder (design-doc OQ-32).
apiVersion: v3.0.2
kind: DataContract
id: p1-source-nps-trails
name: nps_trails
version: 0.2.0
status: active
domain: project1-signal-planner
dataProduct: signal-planner
description:
  purpose: National Park Service Public Trails ArcGIS service for Grand Canyon, giving trail polylines used to sample points every 50 meters. Phase A uses Bright Angel, South Kaibab and North Kaibab (ADR 0020).
  limitations: GeoJSON output, 2,000 records per request, so the pull pages in OBJECTID order. The service has 42 fields (OQ-20); the loader reads OBJECTID, TRLNAME, UNITCODE and the geometry. Grand Canyon is UNITCODE GRCA. Public data from data.gov; credit on the page (OQ-22).
  usage: Input to C3 (trail loader and sampler).
team:
  - username: John
    role: owner
servers:
  - server: nps-public-trails
    type: api
    description: NPS Public Trails ArcGIS service (polylines, GeoJSON, 2,000 records per request), confirmed by the first-run check (OQ-8, OQ-20). Its HTML directory returns 403; the query API works.
    location: "https://mapservices.nps.gov/arcgis/rest/services/NationalDatasets/NPS_Public_Trails/FeatureServer/0/query?where=UNITCODE='GRCA'&outFields=*&orderByFields=OBJECTID&f=geojson (paged with resultOffset). Raw pages: s3://portfolio-{env}-raw-{account}/signal/nps/trails/unitcode=GRCA/fetched_at={time}/."
slaProperties:
  - property: frequency
    value: refresh cadence open
    description: See OQ-25.
  - property: retention
    value: raw files kept
customProperties:
  - property: openQuestions
    value: OQ-8, OQ-20, OQ-22, OQ-25, OQ-36
  - property: adr
    value: adrs/0004, adrs/0018
schema:
  - name: nps_trail_line
    physicalName: nps_trail_line
    physicalType: table
    description: One row per trail line. Partition per pull.
    properties:
      - name: trail_line_id
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        customProperties:
          - property: upstreamField
            value: OBJECTID
          - property: upstreamType
            value: integer
        description: Source key for the line, the service's OBJECTID as text.
      - name: trlname
        logicalType: string
        required: false
        customProperties:
          - property: upstreamField
            value: TRLNAME
          - property: upstreamType
            value: string
        description: Trail name (field TRLNAME). Phase A trails are matched on the whole name (OQ-36).
      - name: unitcode
        logicalType: string
        required: true
        customProperties:
          - property: upstreamField
            value: UNITCODE
          - property: upstreamType
            value: string
        description: Park code (field UNITCODE). Grand Canyon is GRCA (OQ-20).
      - name: geometry_geojson
        logicalType: string
        required: true
        description: Polyline geometry as GeoJSON text, WGS 84 longitude and latitude (confirmed, OQ-20). Stored as text so the lake column has one simple type.
      - name: source_url
        logicalType: string
        required: true
      - name: fetched_at_utc
        logicalType: timestamp
        required: true
      - name: content_sha256
        logicalType: string
        required: true
    quality:
      - type: library
        metric: nullValues
        mustBe: 0
        description: Applies to required fields.
      - type: library
        metric: duplicateValues
        mustBe: 0
        arguments:
          properties:
            - trail_line_id
            - fetched_at_utc
