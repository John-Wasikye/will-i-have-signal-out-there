# ODCS data contract: PLATFORM shared format for usage events from all five sites (ADR-0025).
# Decided Oct 9, 2026: the field list is accepted as drafted (ADR 0025). John may change it.
apiVersion: v3.0.2
kind: DataContract
id: asteroid-watch-platform.usage-events
name: usage_events
version: 0.1.0
status: active
domain: platform
dataProduct: platform-usage-events
tenant: portfolio
description:
  purpose: One event format for usage across all five portfolio sites (ADR-0025). Project 2 loads it into Snowflake and builds the reports (Project 2 FR-33).
  limitations: No raw IP address, no cookie, no query string, and no exact location. Visitors are identified only by a random ID kept on the visitor's device. A visit ends after 30 minutes without an event (decided, ADR 0025). Events are deleted after 90 days (decided, ADR 0025; the same period as pipeline logs).
  usage: Dashboards and the portfolio analytics marts. Snapshot charts are published nightly.
team:
  - username: John
    role: owner
slaProperties:
  - property: retention
    value: 90
    unit: d
    description: Raw events are deleted after 90 days.
servers:
  - server: collect
    type: s3-raw
    environment: prod
    location: always-on raw bucket written by the collection endpoint (ADR-0011); the nightly run loads it.
schema:
  - name: usage_event
    physicalType: json-lines
    properties:
      - name: event_id
        logicalType: string
        required: true
        unique: true
        description: Random identifier generated by the sending site.
      - name: event_time_utc
        logicalType: timestamp
        required: true
        description: Time the event happened on the device, in UTC.
      - name: received_time_utc
        logicalType: timestamp
        required: true
        description: Time the collection endpoint received it, in UTC. Set by the endpoint, not the sender.
      - name: site
        logicalType: string
        required: true
        description: Which portfolio site sent the event (for example asteroid-watch).
      - name: event_name
        logicalType: string
        required: true
        description: Name from the site's event list (for example page_view, lookup_run, answer_shown).
      - name: anon_visitor_id
        logicalType: string
        required: true
        description: Random ID kept on the device. Not linked to any account.
      - name: route
        logicalType: string
        required: false
        description: Page or route name without any query string.
      - name: client_kind
        logicalType: string
        required: false
        description: web or installed (a PWA running from the home screen).
quality:
  - description: No field may hold an IP address, and the collection endpoint drops any IP header before storing.
  - description: Times are UTC; received_time_utc is never earlier than event_time_utc by more than a day (a late phone upload is allowed).
  - description: One event_id appears once.
customProperties:
  - property: collectionEndpoint
    value: POST /v1/events on the serving template's API (openapi.yaml). Exact route to be confirmed when built.
  - property: deleteWindow
    value: 90 days (decided, ADR 0025).
