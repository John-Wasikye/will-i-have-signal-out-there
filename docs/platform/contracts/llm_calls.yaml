# ODCS data contract: PLATFORM shared table. One row per model call, from every project.
# Written by the call logger (ADR-0015). Times are UTC (ADR-0021). Version of the ODCS standard is a working choice (see design doc OQ-P10).
apiVersion: v3.0.2
kind: DataContract
id: asteroid-watch-platform.llm-calls
name: llm_calls
version: 0.1.0
status: active
domain: platform
dataProduct: platform-ai-call-log
tenant: portfolio
description:
  purpose: Records every model call for cost, quality and audit (ADR-0014, ADR-0015). Lets each project's cost per answer and cost per brief be measured (BP rule 14).
  limitations: The end user's question or text is never stored here. Only a hash and length are stored, so personal text does not reach the lake (Default, see design doc OQ-P11).
  usage: Read by each project's model-calls mart (Project 2 contracts/portfolio_analytics_marts.yaml) and by the cost checks.
team:
  - username: John
    role: owner
servers:
  - server: lake
    type: iceberg
    environment: prod
    location: platform lake bucket and Glue database (see design doc section 11)
  - server: lake-dev
    type: iceberg
    environment: dev
    location: separate dev bucket and Glue database (ADR-0020)
schema:
  - name: llm_calls
    physicalType: table
    properties:
      - name: call_id
        logicalType: string
        required: true
        unique: true
        description: Random identifier for the call, generated by the logger.
      - name: called_at_utc
        logicalType: timestamp
        required: true
        description: Time the call was made, in UTC.
      - name: project
        logicalType: string
        required: true
        description: Which project made the call (for example project2).
      - name: purpose
        logicalType: string
        required: true
        description: What the call was for (for example brief, judge, flag_explanation, history_question).
      - name: request_mode
        logicalType: string
        required: true
        description: batch or live. Live calls are only the capped history questions (Project 2 ADR-0002).
      - name: model
        logicalType: string
        required: true
        description: Model identifier as the provider reports it. The provider is not named yet (OQ-P5).
      - name: prompt_version
        logicalType: string
        required: true
        description: Version of the prompt, taken from git.
      - name: input_tokens
        logicalType: integer
        required: true
        description: Tokens sent to the model.
      - name: output_tokens
        logicalType: integer
        required: true
        description: Tokens returned by the model.
      - name: latency_ms
        logicalType: integer
        required: true
        description: Time from request to response, in milliseconds.
      - name: cost_usd
        logicalType: decimal
        required: true
        description: Cost of the call in US dollars, computed from the provider's published price at the time.
      - name: status
        logicalType: string
        required: true
        description: ok, error, or blocked (a blocked brief, for example, when a number check fails).
      - name: question_hash
        logicalType: string
        required: false
        description: For history questions only. A keyed HMAC-SHA256 of the question text, keyed with a secret in Parameter Store. A plain hash is not used, because short questions can be recovered from it. The text itself is not stored.
      - name: trace_id
        logicalType: string
        required: false
        description: X-Ray trace ID of the agent run that made this call (ADR 0015).
      - name: question_length
        logicalType: integer
        required: false
        description: For history questions only. Length of the question in characters.
quality:
  - description: Every row has a call_id, called_at_utc, project, purpose, model, and cost_usd.
  - description: Times are UTC.
  - description: cost_usd is not negative.
customProperties:
  - property: freshnessTarget
    value: Written at the time of each call; loaded into the lake by the nightly run. Numeric target set in operations.md.
  - property: retention
    value: Pipeline logs 90 days in S3 raw form; the lake table is kept (ADR-0019).
