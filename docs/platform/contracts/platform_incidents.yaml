# Scope: shared by all five projects (Projects 1 to 5). Not Project 4's own contract.
# ODCS v3. Shared table contract, one row per real incident.
# Draft. Decided by John, Oct 9, 2026: each real incident gets a short record (BP 0.5, requirements PR-14).
# Default (ADR-0015, for John's approval in OQ-P01): the table is an Iceberg table in the lake.
apiVersion: v3.0.2
kind: DataContract
id: platform-incidents
name: platform_incidents
version: 0.1.0
status: draft
domain: platform
dataProduct: platform
tenant: portfolio
description:
  purpose: >
    A record of each real incident: what broke, the cause and the fix (BP 0.5). Recorded as it
    happens; staged failures are not used (BD Failure testing).
  limitations: >
    Contains no secrets and no personal data. Free text is written by John, not generated by a model.
  usage: Written when an incident opens and updated when it closes. Read by the status page path and by the runbook set.
servers:
  - server: lake-platform-incidents
    type: s3
    location: s3://portfolio-lake-<env>/Platform/incidents/
    environment: prod
    description: Iceberg table in the lake, registered in the Glue catalog of each environment.
schema:
  - name: platform_incidents
    physicalType: table
    description: One row per real incident.
    properties:
      - name: incident_id
        logicalType: string
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        description: Identifier, for example INC-2026-10-09-01.
      - name: opened_at_utc
        logicalType: timestamp
        required: true
        description: Time the incident was opened, in UTC.
      - name: closed_at_utc
        logicalType: timestamp
        required: false
        description: Time the incident was closed, in UTC. Empty while open.
      - name: project
        logicalType: string
        required: true
        description: Project or platform part the incident belongs to.
      - name: pipeline
        logicalType: string
        required: true
        description: DAG or service that failed (for example shooting_star_nightly).
      - name: what_broke
        logicalType: string
        required: true
        description: Short description of what broke.
      - name: cause
        logicalType: string
        required: false
        description: Cause, once known.
      - name: fix
        logicalType: string
        required: false
        description: Fix applied, once known.
      - name: github_issue_url
        logicalType: string
        required: false
        description: Link to the single de-duplicated GitHub issue for this incident (ADR-0015).
      - name: reached_maximum_runtime
        logicalType: boolean
        required: true
        description: True when the nightly run reached its 2-hour maximum (BD Nightly shutdown).
      - name: status
        logicalType: string
        required: true
        description: Open or closed.
        logicalTypeOptions:
          pattern: "^(open|closed)$"
    quality:
      - type: library
        rule: duplicateValues
        mustBe: 0
        description: Unique on incident_id.
slaProperties:
  - property: frequency
    value: on each real incident
    description: Written when an incident opens and updated when it closes.
team:
  - username: jwasikye
    role: owner
    description: John, owner of the platform.
customProperties:
  - property: personalData
    value: none intended; free text must not contain keys, addresses or personal data.
  - property: openQuestions
    value: [OQ-P01]
