# Dependabot opens a pull request when a pinned version has a newer release or a security fix.
# Every pull request still goes through CI and my review, so nothing updates by itself.
#
# It proposes only minor and patch versions, grouped per folder and weekly, so each pull
# request should pass CI on its own. Major versions break things (TypeScript 7, pyspark 4,
# duckdb 2), so they are planned work on their own branch.
#
# Not here, on purpose, and updated by hand on a normal branch. A Dependabot pull request gets
# no repository secrets, so the Terraform plan cannot run on it, and anything that starts the
# plan should come with a plan I can read:
# - Terraform providers.
# - The API packages in platform/serving, which the Terraform workflow packages.
# - The actions in the Terraform workflows and the terraform-init action.
# - The Airflow base image, whose version must match the constraint file in the Dockerfile.
# - The ranges in the root pyproject.toml. Dependabot raises a range's ceiling across a major
#   version even with majors ignored, and CI already installs the newest version in each range.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - .github/workflows/terraform*.yml
      - .github/actions/terraform-init/**
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /platform/box
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Iceberg runtime jar is built for Spark 3.5, so pyspark takes patch versions only.
      - dependency-name: pyspark
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Airflow's constraint file pins pyarrow in the image, and any other version fails the
      # build. The host copy moves with it, by hand.
      - dependency-name: pyarrow
    groups:
      box:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      site:
        patterns: ["*"]
        update-types: ["minor", "patch"]
