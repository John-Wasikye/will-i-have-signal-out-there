name: Terraform apply

# Called by terraform.yml for one environment at a time. The job names its GitHub environment,
# so it starts only after that environment's rules allow it, and only then can it use the
# apply role, which trusts nothing else.
on:
  workflow_call:
    inputs:
      env:
        description: dev or live.
        required: true
        type: string
      suffix:
        description: DEV or LIVE, the ending of this environment's repository variables.
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  apply:
    name: Apply ${{ inputs.env }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    # The repository is public, so the account number is a secret: GitHub hides it in the log.
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - id: init
        uses: ./.github/actions/terraform-init
        with:
          env: ${{ inputs.env }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-kms-key-arn: ${{ secrets.TF_STATE_KMS_KEY_ARN }}
          region: ${{ vars.AWS_REGION }}

      # The plan is saved and applied as it is, so nothing changes between the two.
      - name: Plan and apply
        working-directory: platform/terraform/envs/${{ inputs.env }}
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_lambda_zip_sha256: ${{ steps.init.outputs.lambda-zip-sha256 }}
          TF_VAR_box_ami_id: ${{ vars[format('BOX_AMI_ID_{0}', inputs.suffix)] }}
          TF_VAR_box_subnet_id: ${{ vars[format('BOX_SUBNET_ID_{0}', inputs.suffix)] }}
          TF_VAR_alert_emails: ${{ secrets[format('ALERT_EMAILS_{0}', inputs.suffix)] || '[]' }}
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform apply -input=false -no-color tfplan
