name: Terraform

# A pull request gets a plan for dev and live, shown in the job summary. A merge to main
# applies dev, then live. Each apply waits for its GitHub environment's rules.
# Every job skips until AWS is set up: see .github/workflows/README.md.
on:
  pull_request:
    branches: [main]
    paths:
      - "platform/terraform/**"
      - "platform/serving/**"
      - ".github/workflows/terraform*.yml"
      - ".github/actions/terraform-init/**"
  push:
    branches: [main]
    paths:
      - "platform/terraform/**"
      - "platform/serving/**"
      - ".github/workflows/terraform*.yml"
      - ".github/actions/terraform-init/**"

permissions:
  contents: read

# Applies queue one at a time and are never cancelled halfway. Plans for a pull request
# replace each other.
concurrency:
  group: terraform-${{ github.event_name == 'push' && 'apply' || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan (${{ matrix.env }})
    # A pull request from a fork gets no AWS token, so it is skipped rather than failed.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AWS_SET_UP == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    # The repository is public, so the account number is a secret: GitHub hides it in the log.
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            suffix: DEV
          - env: live
            suffix: LIVE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets[format('TF_PLAN_ROLE_ARN_{0}', matrix.suffix)] }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - id: init
        uses: ./.github/actions/terraform-init
        with:
          env: ${{ matrix.env }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          state-kms-key-arn: ${{ secrets.TF_STATE_KMS_KEY_ARN }}
          region: ${{ vars.AWS_REGION }}

      # Every parameter listed in checks/parameter_paths.yaml must exist before a change that
      # uses it is merged. The check reads names only; the plan role is refused values.
      - name: Check that the listed parameters exist
        env:
          ENV: ${{ matrix.env }}
        run: |
          python -m pip install --quiet "boto3==1.43.118" "pyyaml==6.0.3"
          python checks/parameter_paths.py --check-aws --env "${ENV}"

      # The plan role can write nothing, so the plan takes no state lock. The alert addresses
      # are sensitive in Terraform, so this public log shows only how many there are. GitHub
      # hides secrets in the log but not in the job summary, so the plan text is masked there.
      - name: Plan
        working-directory: platform/terraform/envs/${{ matrix.env }}
        env:
          ENV: ${{ matrix.env }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_lambda_zip_sha256: ${{ steps.init.outputs.lambda-zip-sha256 }}
          TF_VAR_box_ami_id: ${{ vars[format('BOX_AMI_ID_{0}', matrix.suffix)] }}
          TF_VAR_box_subnet_id: ${{ vars[format('BOX_SUBNET_ID_{0}', matrix.suffix)] }}
          TF_VAR_alert_emails: ${{ secrets[format('ALERT_EMAILS_{0}', matrix.suffix)] || '[]' }}
        run: |
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          {
            echo "### Terraform plan for ${ENV}"
            echo '```'
            sed "s/${AWS_ACCOUNT_ID}/***/g" plan.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  apply-dev:
    name: Apply (dev)
    if: github.event_name == 'push' && vars.AWS_SET_UP == 'true'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      env: dev
      suffix: DEV
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  apply-live:
    name: Apply (live)
    needs: apply-dev
    if: github.event_name == 'push' && vars.AWS_SET_UP == 'true'
    uses: ./.github/workflows/terraform-apply.yml
    with:
      env: live
      suffix: LIVE
    permissions:
      contents: read
      id-token: write
    secrets: inherit
