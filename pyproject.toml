[project]
name = "will-i-have-signal-out-there"
version = "0.1.0"
description = "Shared data platform for the portfolio projects: pipelines, publishing, serving and status."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1,<2",
    "fastapi>=0.110,<1",
    "mangum>=0.17,<1",
    "pyarrow>=16,<20",
    "pydantic>=2.6,<3",
]

[tool.setuptools]
# The repo is not one installable package: pipelines and serving are run from
# their folders. This file pins the dependencies and the test settings only.
packages = []

[project.optional-dependencies]
spark = ["pyspark==3.5.9"]
# For closing incident records from a laptop (pipelines/platform/publish/incidents.py).
# Same pin as the box host (platform/box/requirements-host.txt).
ops = ["boto3==1.43.97"]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pyyaml>=6,<7",
    "tzdata>=2024.1",  # Windows has no time zone database of its own
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = [
    "platform/serving/tests",
    "pipelines/platform/tests",
    "pipelines/signal/tests",
    "platform/box/tests",
    ".github/tests",
    "checks/tests",
]
pythonpath = [
    "platform/serving",
    "pipelines/platform/publish",
    "pipelines/platform/spark",
    "pipelines/platform/dags",
    "pipelines/signal",
    "pipelines/signal/dags",
    "platform/box",
    "checks",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette's TestClient warns that httpx is deprecated in favour of httpx2.
    # The warning comes from third-party code. Remove this line when the test client changes.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Mangum 0.22.0, the newest release, asks asyncio for an event loop that does not exist yet.
    # Python 3.12, the Lambda runtime I use, only warns. Python 3.14 would raise an error, so the
    # runtime stays on 3.12 until Mangum fixes this. Remove this line when it does.
    "ignore:There is no current event loop:DeprecationWarning:mangum",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
